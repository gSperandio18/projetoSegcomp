name: CI & Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff Linter
        run: |
          ruff check src tests bin

      - name: Check Code Formatting
        run: |
          ruff format --check src tests bin

      - name: Run Pylint
        run: |
          pylint src/evoting

      - name: Run Pytest Suite with Coverage Safeguard (>= 80%)
        run: |
          pytest --cov=src/evoting --cov-report=xml --cov-fail-under=80

      - name: Verify Documentation Build
        run: |
          mkdocs build
