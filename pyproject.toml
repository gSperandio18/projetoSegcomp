[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-evoting-system"
version = "1.0.0"
description = "Verifiable Electronic Voting System using Exponential ElGamal & RSA Signatures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=41.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pylint>=3.0.0",
    "pre-commit>=3.5.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I", "N", "UP", "B", "A"]
# E501: handled by ruff format
# A003: class attribute `id` in SQLAlchemy models shadows Python builtin `id`
ignore = ["E501", "A003"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"bin/*" = ["C901"]

[tool.pylint.main]
max-line-length = 100
fail-under = 8.5

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "W0511",  # fixme: allows pedagogical # TODO: comments for students
    "R0903",  # too-few-public-methods: expected for SQLAlchemy ORM data models
    "R0801",  # duplicate-code: __all__ package exports across __init__.py
    "R0913",  # too-many-arguments: cryptographic parameters and DB helpers
    "R0917",  # too-many-positional-arguments
    "R0902",  # too-many-instance-attributes: central election server state
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/evoting --cov-report=term-missing --cov-report=html --cov-fail-under=80"
