site_name: Secure E-Voting Technical Documentation
site_description: Architecture, Threat Model, and Cryptographic Specifications for Verifiable Electronic Voting
site_author: Student Engineering Team

theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - footnotes

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Cryptographic Architecture: architecture.md
  - Threat Model & Security Analysis: threat_model.md
  - Independent Audit Guide: audit_guide.md
